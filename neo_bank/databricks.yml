# This is a Databricks asset bundle definition for neo_bank.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: neo_bank
  uuid: be46a53e-91fd-43d2-b4e5-0a10f99a35ce

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-1506361690816079.19.azuredatabricks.net
    variables:
      catalog: data_engineering
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-1506361690816079.19.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/kiranrnaik78@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kiranrnaik78@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: data_engineering
      schema: prod
    permissions:
      - user_name: kiranrnaik78@gmail.com
        level: CAN_MANAGE
